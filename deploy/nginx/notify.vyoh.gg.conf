# Plain HTTP on purpose. Certbot adds the 443 block, the certificate and the
# redirect in place on the box; a repo copy naming a certificate that does not
# exist yet would fail `nginx -t`. So once certbot has run, edit the installed
# file rather than copying this one over it, which would silently drop TLS.
server {
    listen 80;
    listen [::]:80;
    server_name notify.vyoh.gg;

    access_log /var/log/nginx/notify.access.log;
    error_log /var/log/nginx/notify.error.log;

    # A message is at most 16 KB, which the API enforces itself; this keeps a
    # larger body from being spooled to disk on its way to being refused.
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:2013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
